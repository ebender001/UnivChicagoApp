<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BeFitMe Gait and Grip Completed</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div data-site-header></div>

    <main id="main-content" class="container" data-survey-linked="false">
      <section class="card">
        <h1 class="page-title">Gait and Grip Completed</h1>
        <p class="lead">Gait and grip records that do not yet have a survey are listed below.</p>

        <div id="enrollees-status" class="muted" role="status" aria-live="polite">Loading enrollees...</div>

        <div class="table-wrap" id="enrollees-table-wrap" hidden>
          <table class="data-table">
            <thead>
              <tr>
                <th scope="col">Date and Time Completed</th>
                <th scope="col">Survey</th>
                <th scope="col">Edit</th>
              </tr>
            </thead>
            <tbody id="enrollees-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">© <span id="year"></span> BeFitMe — All rights reserved. · <a href="privacy.html">Privacy</a></div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/enrollee-detail-shared.js"></script>
    <script src="js/enrollees.js"></script>
  </body>
</html>
